name: Auto-close issues on develop merge

# GitHub's native "Closes #N" auto-close fires only on default-branch merges.
# This repo's default branch is `main`, but feature work merges first to
# `develop`. This workflow plugs the gap: on each push to `develop`, parse the
# pushed commits AND the bodies of the PRs associated with those commits for
# closing references and close those issues. Two passes: commit messages are
# the primary source (mirrors GitHub's native behaviour); PR bodies are the
# safety net for the case where an authoring agent put the closing keyword
# only in the PR description (issue #149 fix).

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  close-linked-issues:
    name: Close issues referenced in develop commits or their PR bodies
    runs-on: ubuntu-latest
    steps:
      - name: Parse commits + PR bodies and close referenced issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail

          # Skip the very first push (BEFORE is all zeros) and any branch deletion.
          ZEROES="0000000000000000000000000000000000000000"
          if [ "$BEFORE" = "$ZEROES" ] || [ "$AFTER" = "$ZEROES" ]; then
            echo "First push or branch deletion; nothing to compare."
            exit 0
          fi

          # Pass 1: commit message scan (primary).
          MESSAGES=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.commits[].commit.message')

          # Pass 2: PR body scan (safety net). For each commit in the range,
          # find any associated PR and grab its body. Ignore commits with no
          # associated PR (direct pushes, which should not happen on develop
          # but are defended against anyway).
          SHAS=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.commits[].sha')
          PR_BODIES=""
          for SHA in $SHAS; do
            BODY=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].body' 2>/dev/null || true)
            if [ -n "$BODY" ]; then
              PR_BODIES=$(printf "%s\n%s\n" "$PR_BODIES" "$BODY")
            fi
          done

          # Combine both sources before scanning for closing keywords.
          ALL_TEXT=$(printf "%s\n%s\n" "$MESSAGES" "$PR_BODIES")

          ISSUES=$(printf "%s\n" "$ALL_TEXT" \
            | grep -oEi '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' \
            | grep -oE '#[0-9]+' \
            | tr -d '#' \
            | sort -u || true)

          if [ -z "$ISSUES" ]; then
            echo "No closing references in pushed commits or associated PR bodies."
            exit 0
          fi

          for n in $ISSUES; do
            STATE=$(gh api "repos/$REPO/issues/$n" --jq '.state' 2>/dev/null || echo "missing")
            if [ "$STATE" = "open" ]; then
              echo "Closing #$n"
              gh issue close "$n" --repo "$REPO" \
                --comment "Auto-closed by merge to develop." >/dev/null
            elif [ "$STATE" = "closed" ]; then
              echo "Issue #$n already closed; skipping."
            else
              echo "Issue #$n not found; skipping."
            fi
          done
