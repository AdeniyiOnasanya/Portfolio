name: Bug
description: A defect in shipped or in-progress code.
title: "bug: <short summary>"
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use commas, periods, semicolons, parentheses, or colons. Do not use em-dash or emoji.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences. What is wrong.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Numbered steps. Include URL, branch, and commit if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - public
        - admin
        - content
        - auth
        - ci
        - infra
        - seo
        - docs
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
        - P3
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes, screenshots, logs
